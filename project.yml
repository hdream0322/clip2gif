name: Clip2GIF

options:
  bundleIdPrefix: com.heodream
  deploymentTarget:
    macOS: "13.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.2"

targets:
  Clip2GIF:
    type: application
    platform: macOS
    sources:
      - path: Clip2GIF
        excludes:
          - "Resources/**"
          - "**/AGENTS.md"
    dependencies:
      - package: Sparkle
    postBuildScripts:
      - name: "Copy gifski binary"
        script: |
          set -e
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$DEST"
          chmod u+w "$DEST/gifski" 2>/dev/null || true
          cp -f "$SRCROOT/Clip2GIF/Resources/bin/gifski" "$DEST/gifski"
          chmod +x "$DEST/gifski"
          echo "Copied gifski to $DEST/gifski"
      - name: "Install to /Applications"
        script: |
          set -e
          if [ -n "${CI:-}" ]; then
            echo "CI environment detected: skipping /Applications install"
            exit 0
          fi
          SRC="$TARGET_BUILD_DIR/$WRAPPER_NAME"
          DEST="/Applications/$WRAPPER_NAME"
          if [ -d "$SRC" ]; then
            rm -rf "$DEST"
            cp -R "$SRC" "$DEST"
            /System/Library/CoreServices/pbs -update >/dev/null 2>&1 || true
            echo "Installed $WRAPPER_NAME to /Applications"
          fi
    settings:
      base:
        PRODUCT_NAME: Clip2GIF
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Clip2GIF/Info.plist
      properties:
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Sparkle auto-update. Feed points at the appcast.xml asset attached to
        # the latest GitHub Release (uploaded by .github/workflows/release.yml).
        SUFeedURL: https://github.com/hdream0322/clip2gif/releases/latest/download/appcast.xml
        SUPublicEDKey: xcMIw3PIiYFC39sJx/iisdfXJET/cWTkJnvd50QBAdw=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        NSHighResolutionCapable: true
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - ko
          - ja
          - zh-Hans
          - fr
          - de
          - es
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - public.mpeg-4
              - com.apple.quicktime-movie
              - public.avi
              - com.google.webm
            CFBundleTypeExtensions:
              - mp4
              - mov
              - m4v
              - avi
              - webm
        NSServices:
          - NSMenuItem:
              default: GIF으로 변환하기
            NSMessage: convertToGIF
            NSPortName: Clip2GIF
            NSSendTypes:
              - public.file-url
              - NSFilenamesPboardType
            NSSendFileTypes:
              - public.movie
              - public.mpeg-4
              - com.apple.quicktime-movie
              - public.avi
              - org.webmproject.webm
